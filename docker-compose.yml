services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: nakama
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "nakama"]
      interval: 3s
      timeout: 3s
      retries: 10

  nakama:
    image: registry.heroiclabs.com/heroiclabs/nakama:3.26.0
    entrypoint:
      - "/bin/sh"
      - "-ecx"
      - >
        /nakama/nakama migrate up --database.address postgres:localdev@postgres:5432/nakama &&
        exec /nakama/nakama --name nakama1 --database.address postgres:localdev@postgres:5432/nakama --logger.level INFO
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:7350:7350"
      - "127.0.0.1:7351:7351"
    volumes:
      - ./build:/nakama/data/modules
